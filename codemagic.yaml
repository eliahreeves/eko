workflows:
  android-workflow:
    name: Android Workflow
    instance_type: mac_mini_m2
    max_build_duration: 120
    working_directory: untitled_app
    cache:
      cache_paths:
        - $FLUTTER_ROOT/.pub-cache
        - $HOME/.gradle/caches
        - $HOME/Library/Caches/CocoaPods
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'v*'
          include: true
    environment:
      groups:
        - secrets
        - google_play
      android_signing:
        - upload-keystore
      vars:
        PACKAGE_NAME: "com.echo.android"
        GOOGLE_PLAY_TRACK: internal
      flutter: stable
    scripts:
      - name: Get Dependencies
        script: flutter pub get
      - name: Set up key.properties
        script: |
          cd android
          FINAL_KEYSTORE_PATH=${CM_KEYSTORE:-$CM_KEYSTORE_PATH}
          echo "storePassword=$CM_KEYSTORE_PASSWORD" > key.properties
          echo "keyPassword=$CM_KEY_PASSWORD" >> key.properties
          echo "keyAlias=$CM_KEY_ALIAS" >> key.properties
          echo "storeFile=$FINAL_KEYSTORE_PATH" >> key.properties
      - name: Set version from tag and build Android App Bundle
        script: |
          # A. Variable extraction (tag-driven release)
          # Build name: strip leading 'v' from CM_TAG (e.g. v1.7.6 → 1.7.6)
          if [ -n "$CM_TAG" ]; then
            VERSION_NAME="${CM_TAG#v}"
          else
            VERSION_NAME="0.0.0"
          fi
          # Build number: latest from Google Play + 1 (fallback to Codemagic BUILD_NUMBER if none yet)
          LATEST_PLAY=$(google-play get-latest-build-number --package-name "$PACKAGE_NAME" --tracks="$GOOGLE_PLAY_TRACK" 2>/dev/null || true)
          if [ -n "$LATEST_PLAY" ]; then
            BUILD_NUM=$(($LATEST_PLAY + 1))
          else
            BUILD_NUM="${BUILD_NUMBER:-1}"
          fi
          echo "VERSION_NAME=$VERSION_NAME BUILD_NUMBER=$BUILD_NUM"
          # B. Build with overrides
          flutter build appbundle --release \
            --build-name="$VERSION_NAME" \
            --build-number="$BUILD_NUM" \
            --dart-define=ALGOLIA_APP_ID=$ALGOLIA_APP_ID \
            --dart-define=SEARCH_API_KEY=$SEARCH_API_KEY \
            --dart-define=TENOR_API_KEY=$TENOR_API_KEY
    artifacts:
      - build/app/outputs/bundle/release/*.aab
      - build/app/outputs/mapping/release/mapping.txt
    publishing:
      google_play:
        credentials: $GOOGLE_PLAY_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        submit_as_draft: true

  ios-workflow:
    name: iOS Workflow
    instance_type: mac_mini_m2
    max_build_duration: 120
    working_directory: untitled_app
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'v*'
          include: true
    environment:
      groups:
        - secrets
        - google_play
      vars:
        PACKAGE_NAME: "com.echo.android"
        GOOGLE_PLAY_TRACK: internal
      flutter: stable
      xcode: latest
    scripts:
      - name: Get Dependencies
        script: flutter pub get
      - name: Set version from tag and build iOS
        script: |
          # A. Variable extraction (tag-driven release)
          # Build name: strip leading 'v' from CM_TAG (e.g. v1.7.6 → 1.7.6)
          if [ -n "$CM_TAG" ]; then
            VERSION_NAME="${CM_TAG#v}"
          else
            VERSION_NAME="0.0.0"
          fi
          # Build number: same as Android (Google Play latest + 1), fallback to 0
          LATEST_PLAY=$(google-play get-latest-build-number --package-name "$PACKAGE_NAME" --tracks="$GOOGLE_PLAY_TRACK" 2>/dev/null || true)
          if [ -n "$LATEST_PLAY" ]; then
            BUILD_NUM=$(($LATEST_PLAY + 1))
          else
            BUILD_NUM="0"
          fi
          echo "VERSION_NAME=$VERSION_NAME BUILD_NUMBER=$BUILD_NUM"
          # B. Build with overrides
          flutter build ios --release --no-codesign \
            --build-name="$VERSION_NAME" \
            --build-number="$BUILD_NUM" \
            --dart-define=ALGOLIA_APP_ID=$ALGOLIA_APP_ID \
            --dart-define=SEARCH_API_KEY=$SEARCH_API_KEY \
            --dart-define=TENOR_API_KEY=$TENOR_API_KEY
