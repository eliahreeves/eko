name: Release Linux
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v27

      - name: Build tarball
        run: nix build .#tarball

      - name: Upload tarball to release
        uses: softprops/action-gh-release@v2
        with:
          files: result/*.tar.gz
